<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>따라 하기 · 교사를 위한 AI 디지털 적정 기술</title>
<style>
:root{--ink:#172b43;--muted:#526174;--paper:#f4f2e9;--card:#fff;--line:#c6ccd2;--accent:#075bca;--yellow:#ffcd29;
 font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
@media (prefers-color-scheme:dark){:root{--ink:#e6e9ee;--muted:#a6b0bc;--paper:#14181d;--card:#1d232a;--line:#36404b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:2px solid var(--ink);background:var(--card)}
header a{color:var(--ink);font-size:13px}
header h1{margin:0;font-size:17px;flex:1;min-width:200px;word-break:keep-all}
select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.bar{height:6px;background:var(--line)}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:18px;max-width:1400px;width:100%;margin:0 auto}
.shot{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px;display:grid;place-items:center;min-height:300px}
.shot img{max-width:100%;max-height:70vh;border-radius:6px;cursor:zoom-in}
.side{display:flex;flex-direction:column;gap:14px}
.now{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;box-shadow:4px 5px 0 var(--accent)}
.now .k{font:800 13px ui-monospace,monospace;color:var(--accent)}
.now h2{margin:6px 0 8px;font-size:21px;word-break:keep-all}
.now p{margin:0;font-size:15.5px;line-height:1.7;word-break:keep-all}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav button{font:inherit;font-weight:800;font-size:15px;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
.nav button.next{background:var(--yellow);color:#172b43}
.nav button:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;gap:4px;max-height:42vh;overflow:auto;padding-right:4px}
.list button{display:flex;gap:8px;align-items:center;text-align:left;font:inherit;font-size:13.5px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer}
.list button b{flex-shrink:0;width:26px;height:22px;display:grid;place-items:center;border-radius:5px;border:1.5px solid var(--muted);font:700 11.5px ui-monospace,monospace}
.list button.on{border-color:var(--accent);background:var(--card)}.list button.on b{background:var(--accent);border-color:var(--accent);color:#fff}
.list button.done b{border-color:#13875d;color:#13875d}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}dialog img{max-width:96vw;max-height:94vh;border-radius:8px}
dialog::backdrop{background:rgba(0,0,0,.75)}
@media (max-width:860px){main{grid-template-columns:1fr;padding:12px}.list{max-height:none}}
</style>
</head>
<body>
<header><a href="../index.html">← 처음으로</a><h1 id="t"></h1><select id="sel" aria-label="따라 하기 고르기"></select></header>
<div class="bar"><i id="bar"></i></div>
<main>
  <div class="shot"><img id="img" alt=""></div>
  <div class="side">
    <div class="now"><div class="k" id="k"></div><h2 id="h"></h2><p id="p"></p></div>
    <div class="nav"><button id="prev" type="button">← 이전</button><button id="next" class="next" type="button">다음 →</button></div>
    <div class="list" id="list"></div>
  </div>
</main>
<dialog id="zoom"><img id="zimg" alt=""></dialog>

const keys = Object.keys(DATA);
const sel = document.getElementById('sel');
keys.forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = DATA[k].title; sel.appendChild(o); });
let key = keys[0], i = 0;
const $ = id => document.getElementById(id);
function seen(k) { try { return JSON.parse(localStorage.getItem('steps-' + k) || '[]'); } catch(e) { return []; } }
function mark(k, n) { try { const s = new Set(seen(k)); s.add(n); localStorage.setItem('steps-' + k, JSON.stringify([...s])); } catch(e){} }
function show() {
  const set = DATA[key], st = set.steps[i];
  $('t').textContent = set.title; sel.value = key;
  $('img').src = st.img; $('img').alt = st.title;
  $('k').textContent = (i + 1) + ' / ' + set.steps.length;
  $('h').textContent = st.title; $('p').textContent = st.text;
  $('bar').style.width = ((i + 1) / set.steps.length * 100) + '%';
  $('prev').disabled = i === 0;
  $('next').textContent = i === set.steps.length - 1 ? '처음으로 ↺' : '다음 →';
  mark(key, i);
  const done = new Set(seen(key)), list = $('list'); list.replaceChildren();
  set.steps.forEach((s, n) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = (n === i ? 'on ' : '') + (done.has(n) ? 'done' : '');
    const num = document.createElement('b'); num.textContent = n + 1;
    b.append(num, document.createTextNode(s.title));
    b.onclick = () => { i = n; show(); };
    list.appendChild(b);
  });
  const on = list.querySelector('.on');
  if (on && list.scrollHeight > list.clientHeight) {
    const top = on.offsetTop - list.offsetTop;
    if (top < list.scrollTop || top > list.scrollTop + list.clientHeight - on.offsetHeight) list.scrollTop = top - 8;
  }
  history.replaceState(null, '', '#' + key + (i ? '-' + (i + 1) : ''));
}
function go(d) { const n = DATA[key].steps.length; i = d > 0 && i === n - 1 ? 0 : Math.max(0, Math.min(n - 1, i + d)); show(); }
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
sel.onchange = () => { key = sel.value; i = 0; show(); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
$('img').onclick = () => { $('zimg').src = $('img').src; $('zoom').showModal(); };
$('zoom').onclick = () => $('zoom').close();
let sx = null; $('img').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive: true});
$('img').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); sx = null; });
const m = location.hash.slice(1).match(/^([a-z]+)(?:-(\d+))?$/);
if (m && DATA[m[1]]) { key = m[1]; i = m[2] ? Math.min(DATA[key].steps.length, +m[2]) - 1 : 0; }
show();
</script>
