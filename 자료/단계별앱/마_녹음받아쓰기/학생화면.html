<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>녹음하며 받아쓰기</title>
<style>
:root{--ink:#172b43;--muted:#4d5b6b;--paper:#f4f2e9;--brand:#075bca;--brand-tint:#e6f0fc;--ok:#13744f;--ok-tint:#e3f4ea;--bad:#b3261e;--bad-tint:#fdeceb;--warn:#8a5300;--warn-tint:#fff4d6;--gold:#ffcd29;--tap:48px}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.top{background:var(--gold);border-bottom:2px solid var(--ink);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:-.5px}
.bricks{display:flex;gap:4px}.bricks i{width:18px;height:12px;border:2px solid var(--ink);border-radius:3px;background:#e74335}.bricks i+i{background:var(--brand)}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:16px;margin:0 0 18px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;background:var(--gold);font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row .wide{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:700;margin:0 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid #8793a0;border-radius:8px;padding:10px;min-height:var(--tap)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
textarea{min-height:160px;resize:vertical}
.question{background:var(--brand-tint);border-left:5px solid var(--brand);border-radius:0 8px 8px 0;padding:10px 12px;margin:10px 0 0;white-space:pre-wrap}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:10px 16px;font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--brand);color:#fff}
.btn.go{background:var(--ok);color:#fff}
.btn.block{display:flex;width:100%}
.btn.small{min-height:40px;font-size:14px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.msg{border-radius:8px;padding:10px 12px;margin:10px 0 0;font-size:15px;white-space:pre-wrap}
.msg.bad{background:var(--bad-tint);color:var(--bad);border:2px solid var(--bad)}
.msg.warn{background:var(--warn-tint);color:var(--warn);border:2px solid var(--warn)}
.msg.ok{background:var(--ok-tint);color:var(--ok);border:2px solid var(--ok)}
.done{text-align:center}
.done .big{font-size:26px;font-weight:800;color:var(--ok);margin:4px 0}
.linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;text-decoration:underline;padding:8px 0;min-height:40px;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs figure{margin:0;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#eef1f4;position:relative}
.thumbs img{display:block;width:100%;height:96px;object-fit:cover}
.thumbs figcaption{font-size:12px;padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:800;cursor:pointer}
.busy{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.recbox{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.rectime{font:800 28px/1 ui-monospace,Consolas,monospace;min-width:92px}
.rectime.on{color:var(--bad)}
.level{flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#eef1f4}
.level i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.live{min-height:120px;border:2px dashed #8793a0;border-radius:8px;padding:10px;background:#fbfbf8;white-space:pre-wrap}
.live .interim{color:#6b7684}
.live:empty:before{content:"녹음을 시작하면 여기에 말이 글로 나타나요.";color:#6b7684}
audio{width:100%;margin:10px 0}
</style>
</head>
<body>
<header class="top"><h1 id="appName">녹음하며 받아쓰기</h1><span class="bricks" aria-hidden="true"><i></i><i></i></span></header>
<main>
  <p id="loadMsg" class="msg warn">과제를 불러오는 중이에요…</p>

  <section class="card" id="whoCard">
    <h2><span class="num">1</span>나는 누구</h2>
    <div class="row">
      <div><label for="grade">학년</label><select id="grade"><option value="">고르기</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
      <div><label for="cls">반</label><input id="cls" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"></div>
      <div><label for="num">번호</label><input id="num" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"></div>
      <div class="wide"><label for="name">이름</label><input id="name" maxlength="20" autocomplete="off"></div>
      <div class="wide" id="codeBox" hidden><label for="code">우리 반 코드</label><input id="code" inputmode="numeric" maxlength="8" autocomplete="off"></div>
    </div>
    <button type="button" class="linkbtn" id="notMe">다른 사람이에요 (칸 비우기)</button>
  </section>

  <section class="card" id="taskCard">
    <h2><span class="num">2</span>과제</h2>
    <label for="task">과제 고르기</label>
    <select id="task"></select>
    <p class="question" id="question" hidden></p>
  </section>

  <section class="card" id="answerCard">
    <h2><span class="num">3</span>말하고 받아쓰기</h2>
    <div class="recbox"><div class="rectime" id="recTime">00:00</div><div class="level" aria-hidden="true"><i id="levelBar"></i></div></div>
    <button type="button" class="btn primary block" id="recStart">🎤 녹음 시작</button>
    <button type="button" class="btn block" id="recStop" hidden>⏹️ 멈추기</button>
    <p class="msg warn" id="srNote" hidden></p>
    <p class="hint">3분이 되면 저절로 멈춰요.</p>
    <div id="liveBox">
      <label>받아쓰는 글</label>
      <div class="live" id="live" aria-live="polite"></div>
    </div>
    <div id="after" hidden>
      <label for="player">내 녹음 듣기</label>
      <audio id="player" controls></audio>
      <label for="answer">받아쓴 글 고치기 (들으면서 틀린 곳을 고쳐요)</label>
      <textarea id="answer" maxlength="5000"></textarea>
      <div class="tools"><button type="button" class="btn small" id="redo">🔁 다시 녹음</button></div>
      <button type="button" class="btn go block" id="send">✅ 내기</button>
    </div>
  </section>

  <p id="sendMsg" class="msg bad" hidden></p>

  <section class="card done" id="doneCard" hidden>
    <p class="big">✅ 냈어요</p>
    <p id="doneAt"></p>
    <button type="button" class="btn primary" id="again">하나 더 내기</button>
  </section>
</main>
<script>
/* ===== 공통: 누구 · 과제 · 알림 ===== */
var $ = function (id) { return document.getElementById(id); };
var STATE = { tasks: [] };

/* 저장 주소 부르기. 이 화면은 앱스 스크립트 밖(깃허브 페이지 등)에 있고, 주소 끝의 ?api= 로 저장 주소를 받습니다.
   구글 앱스 스크립트 주소 모양이 아니면 쓰지 않습니다. 남이 만든 주소로 학생 글이 가지 않게 하려는 것입니다 */
var API = (function () {
  var q = '';
  try { q = new URLSearchParams(location.search).get('api') || ''; } catch (e) { q = ''; }
  if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(q)) return q;
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /^http:\/\/(localhost|127\.0\.0\.1):\d+\/exec$/.test(q)) return q;   // 만드는 사람 컴퓨터에서 시험할 때만
  return '';
})();

function call(fn, arg) {
  if (!API) return Promise.reject(new Error('주소 끝에 ?api=저장 주소 가 없어요. 선생님께 받은 주소로 다시 열어요.'));
  var body = { action: fn };
  Object.keys(arg || {}).forEach(function (k) { body[k] = arg[k]; });
  /* 글자(text/plain)로 보내면 브라우저가 미리 묻는 요청(preflight)을 보내지 않아 앱스 스크립트가 받습니다 */
  return fetch(API, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) {
      if (!r.ok) throw new Error('저장 주소가 대답하지 않아요 (' + r.status + ').');
      return r.json();
    }, function () {
      throw new Error('인터넷 연결을 확인하고 다시 눌러요.');
    });
}

function remember() {
  try { localStorage.setItem('who', JSON.stringify({ grade: $('grade').value, cls: $('cls').value, num: $('num').value, name: $('name').value, code: $('code').value })); } catch (e) { }
}
function recall() {
  try {
    var w = JSON.parse(localStorage.getItem('who') || '{}');
    ['grade', 'cls', 'num', 'name', 'code'].forEach(function (k) { if (w[k]) $(k).value = w[k]; });
  } catch (e) { }
}
function who() {
  return { grade: $('grade').value, cls: $('cls').value.trim(), num: $('num').value.trim(), name: $('name').value.trim(), code: $('code').value.trim(), task: $('task').value };
}
/** 화면에서 먼저 봅니다. 서버도 한 번 더 봅니다 */
function whoProblem() {
  var w = who();
  if (!w.grade) return '학년을 골라요.';
  if (!/^\d{1,2}$/.test(w.cls)) return '반을 숫자로 적어요.';
  if (!/^\d{1,2}$/.test(w.num)) return '번호를 숫자로 적어요.';
  if (!w.name) return '이름을 적어요.';
  if (!$('codeBox').hidden && !w.code) return '우리 반 코드를 적어요.';
  if (!w.task) return '과제를 골라요.';
  return '';
}
function showError(text) {
  var m = $('sendMsg');
  m.textContent = '⚠️ ' + text;
  m.hidden = false;
  m.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function hideError() { $('sendMsg').hidden = true; }
function busy(btn, on, label) {
  if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.textContent = ''; var s = document.createElement('span'); s.className = 'busy'; btn.appendChild(s); btn.appendChild(document.createTextNode(' ' + (label || '보내는 중'))); }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}
function done(res) {
  $('answerCard').hidden = true;
  hideError();
  $('doneAt').textContent = $('task').value + ' · ' + res.at;
  $('doneCard').hidden = false;
  $('doneCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function showQuestion() {
  var t = STATE.tasks.filter(function (x) { return x.name === $('task').value; })[0];
  $('question').textContent = t ? t.question : '';
  $('question').hidden = !(t && t.question);
}

['grade', 'cls', 'num', 'name', 'code'].forEach(function (k) { $(k).addEventListener('change', remember); });
$('task').addEventListener('change', showQuestion);
$('notMe').addEventListener('click', function () {
  ['grade', 'cls', 'num', 'name', 'code'].forEach(function (k) { $(k).value = ''; });
  try { localStorage.removeItem('who'); } catch (e) { }
  $('grade').focus();
});
$('again').addEventListener('click', function () {
  $('doneCard').hidden = true;
  $('answerCard').hidden = false;
  resetAnswer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function loadTasks() {
  call('getTasks', {}).then(function (res) {
    if (!res || !res.ok) throw new Error((res && res.msg) || '');
    STATE.tasks = res.tasks || [];
    if (res.app) { $('appName').textContent = res.app; document.title = res.app; }
    $('codeBox').hidden = !res.needCode;
    var sel = $('task');
    sel.textContent = '';
    if (!STATE.tasks.length) {
      $('loadMsg').className = 'msg warn';
      $('loadMsg').textContent = '지금 열린 과제가 없어요. 선생님께 여쭤요.';
      return;
    }
    var first = document.createElement('option'); first.value = ''; first.textContent = '고르기'; sel.appendChild(first);
    STATE.tasks.forEach(function (t) { var o = document.createElement('option'); o.value = t.name; o.textContent = t.name; sel.appendChild(o); });
    if (STATE.tasks.length === 1) { sel.value = STATE.tasks[0].name; showQuestion(); }
    $('loadMsg').hidden = true;
  }).catch(function (err) {
    $('loadMsg').className = 'msg bad';
    $('loadMsg').textContent = '⚠️ 과제를 불러오지 못했어요. 화면을 새로 고쳐요.' + (err && err.message ? '\n(' + err.message + ')' : '');
  });
}

/* 사진을 가로 세로 1600픽셀 안의 jpg 로 줄입니다. 드라이브 OCR 은 2MB 이하 사진만 읽습니다 */
function shrinkImage(file, maxSide) {
  maxSide = maxSide || 1600;
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var data = c.toDataURL('image/jpeg', 0.85);
      resolve({ b64: data.split(',')[1], mime: 'image/jpeg', name: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', preview: data });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이 사진 형식은 열지 못했어요. 화면을 캡처해 올리거나 카메라 설정을 「호환성 우선」으로 바꿔요.')); };
    img.src = url;
  });
}
function fileToB64(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve({ b64: String(r.result).split(',')[1], mime: file.type || 'application/octet-stream', name: file.name || 'file' }); };
    r.onerror = function () { reject(new Error('파일을 읽지 못했어요.')); };
    r.readAsDataURL(file);
  });
}

/* ===== 마 단계: 녹음 + 브라우저 받아쓰기 ===== */
var MAX_SEC = 180;
var R = { stream: null, rec: null, chunks: [], sr: null, srUsed: false, srDead: '', finalText: '', interim: '',
          t0: 0, timer: null, blob: null, seconds: 0, stopping: false, finished: false, wantFinish: false, sid: 0, audioCtx: null, raf: 0 };
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function two(n) { return ('0' + n).slice(-2); }
function pickMime() {
  var list = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  for (var i = 0; i < list.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}
function note(text) { $('srNote').textContent = text ? '⚠️ ' + text : ''; $('srNote').hidden = !text; }
function drawLive() {
  var box = $('live');
  box.textContent = '';
  if (R.finalText) box.appendChild(document.createTextNode(R.finalText));
  if (R.interim) { var s = document.createElement('span'); s.className = 'interim'; s.textContent = R.interim; box.appendChild(s); }
}

/* 마이크 소리 크기 막대. 아이가 「녹음이 되고 있나」를 눈으로 봅니다 */
function startLevel(stream) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    R.audioCtx = new AC();
    var an = R.audioCtx.createAnalyser(); an.fftSize = 512;
    R.audioCtx.createMediaStreamSource(stream).connect(an);
    var buf = new Uint8Array(an.fftSize);
    (function tick() {
      an.getByteTimeDomainData(buf);
      var peak = 0;
      for (var i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
      $('levelBar').style.width = Math.min(100, peak * 1.6) + '%';
      R.raf = requestAnimationFrame(tick);
    })();
  } catch (e) { }
}

function startSpeech() {
  if (!SR) { note('이 브라우저는 자동 받아쓰기를 못 해요. 녹음은 그대로 돼요. 멈춘 뒤 키보드의 🎤 단추로 글을 채워요.'); return; }
  var sr = new SR();
  sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true;
  sr.onresult = function (e) {
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var t = e.results[i][0].transcript;
      if (e.results[i].isFinal) R.finalText += t.trim() + '\n'; else interim += t;
    }
    R.interim = interim;
    R.srUsed = true;
    drawLive();
  };
  sr.onerror = function (e) {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    R.srDead = e.error;
    var why = { 'not-allowed': '받아쓰기 권한이 막혀 있어요.', 'service-not-allowed': '이 기기에서 받아쓰기가 막혀 있어요.',
                'audio-capture': '이 기기는 녹음과 받아쓰기를 함께 못 해요.', network: '받아쓰기 서버에 닿지 못했어요.' }[e.error] || '받아쓰기가 멈췄어요.';
    note(why + ' 녹음은 그대로 돼요. 멈춘 뒤 키보드의 🎤 단추로 글을 채워요.');
  };
  /* 크롬은 조용하면 받아쓰기를 스스로 끝냅니다. 녹음 중이면 다시 켭니다 */
  sr.onend = function () {
    if (sr !== R.sr) return;
    if (R.interim) { R.finalText += R.interim.trim() + '\n'; R.interim = ''; drawLive(); }
    if (R.stopping) { finish(); return; }
    if (R.rec && R.rec.state === 'recording' && !R.srDead) { try { sr.start(); } catch (e) { } }
  };
  R.sr = sr;
  try { sr.start(); } catch (e) { R.sr = null; note('받아쓰기를 켜지 못했어요. 녹음은 그대로 돼요.'); }
}

$('recStart').addEventListener('click', function () {
  hideError(); note('');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    showError('이 브라우저는 화면 안 녹음을 못 해요. 크롬이나 사파리 최신판으로 열어요.');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    R.stream = stream; R.chunks = []; R.finalText = ''; R.interim = ''; R.srUsed = false; R.srDead = '';
    R.stopping = false; R.finished = false; R.wantFinish = false; R.blob = null; R.sr = null; R.sid++;
    var mime = pickMime();
    R.rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    R.rec.ondataavailable = function (e) { if (e.data && e.data.size) R.chunks.push(e.data); };
    R.rec.onstop = function () {
      R.blob = new Blob(R.chunks, { type: R.rec.mimeType || mime || 'audio/webm' });
      if (R.wantFinish || !R.sr || R.srDead) finish();
    };
    R.rec.start(1000);
    R.t0 = Date.now();
    $('recTime').classList.add('on');
    R.timer = setInterval(function () {
      var s = Math.floor((Date.now() - R.t0) / 1000);
      $('recTime').textContent = two(Math.floor(s / 60)) + ':' + two(s % 60);
      if (s >= MAX_SEC) stopRec();
    }, 250);
    $('recStart').hidden = true; $('recStop').hidden = false;
    $('after').hidden = true; $('liveBox').hidden = false;
    drawLive();
    startLevel(stream);
    startSpeech();
  }).catch(function (err) {
    showError(err && err.name === 'NotAllowedError'
      ? '마이크를 허락해야 녹음할 수 있어요. 주소창 옆 자물쇠 → 마이크 → 허용.'
      : '마이크를 열지 못했어요. 다른 앱이 마이크를 쓰고 있지 않은지 봐요.');
  });
});

function stopRec() {
  if (!R.rec || R.rec.state !== 'recording') return;
  clearInterval(R.timer);
  R.seconds = Math.round((Date.now() - R.t0) / 1000);
  R.stopping = true;
  R.rec.stop();
  if (R.sr && !R.srDead) {
    var sid = R.sid;
    try { R.sr.stop(); } catch (e) { }
    setTimeout(function () { if (sid === R.sid) finish(); }, 2500);   // 마지막 말이 글로 들어올 틈
  }
  R.stream.getTracks().forEach(function (t) { t.stop(); });
  cancelAnimationFrame(R.raf); $('levelBar').style.width = '0';
  try { R.audioCtx && R.audioCtx.close(); } catch (e) { }
  $('recTime').classList.remove('on');
  $('recStop').hidden = true;
}
$('recStop').addEventListener('click', stopRec);

function finish() {
  if (R.finished) return;
  if (!R.blob) { R.wantFinish = true; return; }   // 녹음 파일이 아직 안 만들어졌으면 만들어진 뒤에
  R.finished = true;
  $('player').src = URL.createObjectURL(R.blob);
  $('answer').value = R.finalText.trim();
  if (!R.finalText.trim() && !R.srDead) note(SR ? '받아쓴 글이 없어요. 녹음을 들으며 직접 적거나 키보드의 🎤 단추로 채워요.' : '');
  $('liveBox').hidden = true;
  $('after').hidden = false;
  $('recStart').hidden = true;
}

$('redo').addEventListener('click', function () {
  if ($('answer').value.trim() && !confirm('지금 녹음과 글을 버리고 다시 녹음할까요?')) return;
  resetAnswer();
});

function resetAnswer() {
  R.sid++;
  R.blob = null; R.sr = null; R.finalText = ''; R.interim = ''; R.finished = false; R.wantFinish = false;
  $('answer').value = ''; $('recTime').textContent = '00:00';
  $('after').hidden = true; $('liveBox').hidden = false; $('recStart').hidden = false; $('recStop').hidden = true;
  note(''); drawLive();
}

$('send').addEventListener('click', function () {
  hideError();
  var why = whoProblem() || (R.blob ? '' : '녹음을 먼저 해요.');
  if (why) { showError(why); return; }
  remember();
  var btn = $('send');
  busy(btn, true, '녹음 보내는 중');
  var reader = new FileReader();
  reader.onload = function () {
    var p = who();
    var type = (R.blob.type || 'audio/webm').split(';')[0];
    p.audio = { b64: String(reader.result).split(',')[1], mime: type, name: '녹음.' + (/mp4/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm') };
    p.text = $('answer').value;
    p.auto = R.finalText.trim();
    p.seconds = R.seconds;
    p.way = R.srUsed ? 'auto' : 'none';
    call('submitRecording', p).then(function (res) {
      busy(btn, false);
      if (!res.ok) { showError(res.msg); return; }
      done(res);
    }).catch(function (err) {
      busy(btn, false);
      showError(err.message);
    });
  };
  reader.onerror = function () { busy(btn, false); showError('녹음을 읽지 못했어요. 다시 녹음해요.'); };
  reader.readAsDataURL(R.blob);
});

if (!API) showError('주소 끝에 ?api=저장 주소 가 없어요. 선생님께 받은 주소로 다시 열어요.');

recall();
loadTasks();
</script>
</body>
</html>
